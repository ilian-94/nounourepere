<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#537B68">
  <meta name="description" content="Plannings, présences, absences et récapitulatifs pour assistante maternelle.">
  <title>NounouRepère</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a href="#/accueil" class="brand" aria-label="Accueil NounouRepère">
      <img src="logo.svg" alt="NounouRepère" class="brand-logo" id="brandLogo">
      <img src="icons/icon.svg" alt="" class="brand-icon" id="brandIcon">
      <span class="brand-title" id="pageTitle"></span>
    </a>
  </header>

  <main id="app" tabindex="-1"></main>

  <button class="fab" id="fab" type="button" data-act="open-entry" aria-label="Saisir une présence ou une absence">
    <span aria-hidden="true">＋</span> Saisir
  </button>

  <nav class="bottomnav" aria-label="Navigation principale">
    <a href="#/accueil" data-nav="accueil"><span class="ni" aria-hidden="true">🏠</span>Accueil</a>
    <a href="#/enfants" data-nav="enfants"><span class="ni" aria-hidden="true">👶</span>Enfants</a>
    <a href="#/calendrier" data-nav="calendrier"><span class="ni" aria-hidden="true">📅</span>Calendrier</a>
    <a href="#/recap" data-nav="recap"><span class="ni" aria-hidden="true">📊</span>Récap</a>
    <a href="#/reglages" data-nav="reglages"><span class="ni" aria-hidden="true">⚙️</span>Réglages</a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
  <script src="paie.js"></script>
  <script src="fiscal.js"></script>
  <script src="regles.js"></script>
  <script src="mois.js"></script>
</body>
</html>
